[project]
name = "notaryoutreach"
version = "0.1.0"
description = "Local Notary and VC outreach with SQLite storage and human email review"
readme = "README.md"
authors = [
    { email = "nikhilrr2311@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq",
    "openai>=2,<3",
    "anthropic>=0.75,<1",
    "httpx>=0.28,<1",
    "pypdf",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3,<5",
    "streamlit>=1.64,<2",
]

[project.scripts]
outreach = "notaryoutreach:main"
notaryoutreach = "notaryoutreach:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["notaryoutreach", "agents", "graph", "providers", "storage", "services", "ui", "db"]
# Package data under db/, including migrations/*.sql, is included automatically.
source-exclude = [".env", "*.db", "*.db-*", "*.sqlite", "*.sqlite-*", "*.sqlite3", "*.sqlite3-*"]
