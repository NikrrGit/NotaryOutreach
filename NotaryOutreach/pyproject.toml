[project]
name = "notaryoutreach"
version = "0.1.0"
description = "Local notary outreach workflow with Supabase storage and human email review"
readme = "README.md"
authors = [
    { email = "nikhilrr2311@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq",
    "pypdf",
    "supabase>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
notaryoutreach = "notaryoutreach:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
